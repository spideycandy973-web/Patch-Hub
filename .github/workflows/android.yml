name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include the Android SDK.
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patch-hub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK to alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f369f258-patch-hub' && startsWith(github.event.head_commit.message, 'Publish Patch Hub 0.4.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.4.0-alpha app/build/outputs/apk/debug/app-debug.apk --clobber
